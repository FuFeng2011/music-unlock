<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音乐解锁 · Music Unlock</title>
<style>
:root{
  --bg:#070a16; --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.12);
  --txt:#e8ecf8; --sub:#9aa3c0; --cyan:#3dd7ff; --violet:#8b5cf6; --pink:#ff5d9e;
  --ok:#2fe6a8; --err:#ff6b81;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg); color:var(--txt); overflow-x:hidden;
  display:flex; align-items:center; justify-content:center; min-height:100vh;
  padding:32px 16px;
}
/* 极光背景 */
.aurora{position:fixed; inset:0; z-index:-2; background:radial-gradient(1200px 800px at 20% -10%, #14204a 0%, transparent 60%), radial-gradient(1000px 700px at 110% 20%, #251244 0%, transparent 60%), radial-gradient(900px 900px at 50% 120%, #0d2b3a 0%, transparent 60%), var(--bg)}
.blob{position:fixed; z-index:-1; width:520px; height:520px; border-radius:50%; filter:blur(110px); opacity:.45; animation:drift 18s ease-in-out infinite alternate}
.b1{background:#3dd7ff; top:-140px; left:-120px; animation-duration:16s}
.b2{background:#8b5cf6; bottom:-160px; right:-100px; animation-duration:22s; animation-delay:-6s}
.b3{background:#ff5d9e; top:40%; left:55%; width:380px; height:380px; animation-duration:26s; animation-delay:-12s; opacity:.28}
@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(70px,-50px) scale(1.15)}
  100%{transform:translate(-50px,60px) scale(.95)}
}

.wrap{width:min(720px,100%)}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:28px;
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  padding:38px 34px; box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  animation:rise .7s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes rise{from{opacity:0; transform:translateY(26px) scale(.97)}to{opacity:1; transform:none}}

h1{font-size:26px; font-weight:600; letter-spacing:.5px; display:flex; align-items:center; gap:12px}
h1 .logo{
  width:42px; height:42px; border-radius:13px; flex:none; position:relative;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(61,215,255,.35);
  animation:beat 2.6s ease-in-out infinite;
}
@keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.12)}16%{transform:scale(1)}}
.logo svg{width:22px;height:22px}
.sub{color:var(--sub); font-size:13.5px; margin:10px 0 26px}

/* 拖放区 */
.drop{
  position:relative; border:2px dashed rgba(255,255,255,.22); border-radius:20px;
  padding:52px 20px; text-align:center; cursor:pointer; overflow:hidden;
  transition:border-color .3s, background .3s, transform .25s;
}
.drop::before{ /* 内部呼吸光 */
  content:""; position:absolute; inset:-40%; z-index:0;
  background:conic-gradient(from 0deg, transparent 0 300deg, rgba(61,215,255,.16) 340deg, transparent 360deg);
  animation:spin 7s linear infinite; opacity:0; transition:opacity .3s;
}
@keyframes spin{to{transform:rotate(360deg)}}
.drop:hover{border-color:rgba(61,215,255,.65); background:rgba(61,215,255,.045)}
.drop.drag{border-color:var(--cyan); background:rgba(61,215,255,.08); transform:scale(1.02); box-shadow:0 0 60px rgba(61,215,255,.25)}
.drop.drag::before{opacity:1}
.drop>*{position:relative; z-index:1}
.note{
  width:64px; height:64px; margin:0 auto 16px; border-radius:50%;
  background:linear-gradient(135deg, rgba(61,215,255,.16), rgba(139,92,246,.16));
  border:1px solid rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center;
  animation:float 3.2s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.note svg{width:30px;height:30px}
.drop .big{font-size:17px; font-weight:600}
.drop .hint{color:var(--sub); font-size:12.5px; margin-top:8px}
kbd{
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); border-bottom-width:2px;
  border-radius:6px; padding:1px 7px; font-size:12px; font-family:inherit;
}

/* 文件列表 */
.list{margin-top:22px; display:flex; flex-direction:column; gap:10px}
.item{
  display:flex; align-items:center; gap:14px; padding:13px 16px;
  background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.09); border-radius:15px;
  animation:slide .45s cubic-bezier(.2,.9,.3,1.15) both;
}
@keyframes slide{from{opacity:0; transform:translateX(-22px)}to{opacity:1; transform:none}}
.badge{
  flex:none; font-size:11px; font-weight:700; letter-spacing:.8px; padding:4px 9px; border-radius:8px; color:#fff;
}
.badge.ncm{background:linear-gradient(135deg,#e5484d,#b3202a)}
.badge.kgm{background:linear-gradient(135deg,#2f7dff,#1b4fc4)}
.badge.kgma{background:linear-gradient(135deg,#7a5cff,#4b2fd6)}
.badge.vpr{background:linear-gradient(135deg,#00b39b,#007a6d)}
.badge.legacy{background:linear-gradient(135deg,#6b7280,#3f4653)}
.info{flex:1; min-width:0}
.fname{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fout{font-size:11.5px; color:var(--sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.track{height:5px; border-radius:99px; background:rgba(255,255,255,.09); margin-top:7px; overflow:hidden; position:relative}
.fill{
  height:100%; width:0%; border-radius:99px; transition:width .4s ease;
  background:linear-gradient(90deg,var(--cyan),var(--violet));
}
.fill::after{
  content:""; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shimmer 1.1s linear infinite;
}
@keyframes shimmer{to{transform:translateX(100%)}}
.state{flex:none; width:34px; text-align:center}
.spin{
  width:22px; height:22px; border-radius:50%; border:3px solid rgba(255,255,255,.15); border-top-color:var(--cyan);
  animation:rot 0.8s linear infinite; display:inline-block;
}
@keyframes rot{to{transform:rotate(360deg)}}
.check{width:26px; height:26px; display:inline-block}
.check circle{fill:none; stroke:var(--ok); stroke-width:3; stroke-dasharray:72; stroke-dashoffset:72; animation:draw .6s .1s ease forwards}
.check path{fill:none; stroke:var(--ok); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:30; stroke-dashoffset:30; animation:draw .4s .45s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.x{display:inline-block; color:var(--err); font-size:26px; font-weight:700; animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.item.err{border-color:rgba(255,107,129,.4); background:rgba(255,107,129,.06)}

/* 底部 */
.foot{margin-top:26px; display:flex; justify-content:space-between; align-items:center; gap:14px}
.summary{color:var(--sub); font-size:13px}
.summary b{color:var(--txt)}
button{
  font-family:inherit; border:none; cursor:pointer; color:#fff; font-size:14px; font-weight:600;
  padding:11px 22px; border-radius:14px; letter-spacing:.5px;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  box-shadow:0 8px 26px rgba(139,92,246,.35); transition:transform .2s, box-shadow .2s, opacity .2s;
}
button:hover{transform:translateY(-2px); box-shadow:0 12px 32px rgba(139,92,246,.5)}
button:active{transform:translateY(0) scale(.97)}
button.ghost{background:rgba(255,255,255,.07); box-shadow:none; border:1px solid rgba(255,255,255,.14)}
button.ghost:hover{background:rgba(255,255,255,.12); box-shadow:none}
button:disabled{opacity:.45; pointer-events:none}
canvas#fx{position:fixed; inset:0; pointer-events:none; z-index:10}
</style>
</head>
<body>
<div class="aurora"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="fx"></canvas>

<div class="wrap">
  <div class="card">
    <h1><span class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </span>音乐解锁</h1>
    <div class="sub">网易云 <b>.ncm</b> · 酷狗 <b>.kgm / .kgma / .vpr</b> → 无损 <b>FLAC / MP3</b>（本地解密，文件不上传网络）</div>

    <div class="drop" id="drop">
      <div class="note">
        <svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="1.8" stroke-linecap="round"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3dd7ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="big">把加密音乐拖到这里</div>
      <div class="hint">或 <kbd>点击选择文件</kbd> · 支持批量 · 解密结果保存在 output 文件夹</div>
    </div>
    <input type="file" id="picker" multiple accept=".ncm,.kgm,.kgma,.vpr" style="display:none">

    <div class="list" id="list"></div>

    <div class="foot">
      <div class="summary" id="summary">等待文件…</div>
      <div style="display:flex; gap:10px">
        <button class="ghost" id="openBtn" disabled>打开输出文件夹</button>
        <button id="againBtn" class="ghost">清空重来</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), picker = $('#picker'), list = $('#list'), summary = $('#summary');
const BADGE = {ncm:'NCM', kgm_new:'KGM', kgm_legacy:'KGM·旧', vpr:'VPR'};

drop.addEventListener('click', () => picker.click());
picker.addEventListener('change', () => { addFiles([...picker.files]); picker.value=''; });

['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', ev => addFiles([...ev.dataTransfer.files]));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

let busy = false;
async function addFiles(files){
  if(!files.length) return;
  const audioFiles = files.filter(f => /\.(ncm|kgm|kgma|vpr)$/i.test(f.name));
  if(!audioFiles.length){ alert('只支持 .ncm / .kgm / .kgma / .vpr 文件'); return; }
  if(busy) return;
  busy = true;
  for(const f of audioFiles){
    const el = document.createElement('div');
    el.className = 'item';
    const ext = f.name.split('.').pop().toLowerCase();
    el.innerHTML = `
      <span class="badge ${ext==='ncm'?'ncm':ext==='kgma'?'kgma':ext==='vpr'?'vpr':'kgm'}">${ext.toUpperCase()}</span>
      <div class="info"><div class="fname">${esc(f.name)}</div><div class="fout">解密中…</div>
        <div class="track"><div class="fill" style="width:18%"></div></div></div>
      <div class="state"><span class="spin"></span></div>`;
    list.appendChild(el);
    el.scrollIntoView({behavior:'smooth', block:'nearest'});
    try{
      const r = await fetch('/api/convert?name='+encodeURIComponent(f.name), {method:'PUT', body:await f.arrayBuffer()});
      const j = await r.json();
      const fill = el.querySelector('.fill');
      fill.style.width = '100%';
      el.querySelector('.fout').textContent = '→ ' + j.name + (j.cover ? '（已提取封面）' : '');
      el.querySelector('.state').innerHTML = '<span class="check"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11"/><path d="M7 13.5l4 4 8-9"/></svg></span>';
      burst(30);
    }catch(err){
      el.classList.add('err');
      const msg = (err && err.message) || '解密失败';
      el.querySelector('.fout').textContent = msg;
      el.querySelector('.state').innerHTML = '<span class="x">✕</span>';
      el.querySelector('.fill').style.background = 'var(--err)';
    }
  }
  refreshSummary();
  busy = false;
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

async function refreshSummary(){
  try{
    const s = await (await fetch('/api/status')).json();
    $('#openBtn').disabled = s.ok === 0;
    summary.innerHTML = s.total ? `共 <b>${s.total}</b> 个 · 成功 <b style="color:#2fe6a8">${s.ok}</b> · 失败 <b style="color:#ff6b81">${s.fail}</b>` : '等待文件…';
    if(s.total && s.done===s.total && s.ok===s.total){ burst(140); }
  }catch(e){}
}
$('#openBtn').addEventListener('click', () => fetch('/api/open'));
$('#againBtn').addEventListener('click', () => { list.innerHTML=''; refreshSummary(); });

/* 彩带粒子 */
const cv = $('#fx'), ctx = cv.getContext('2d');
let parts = [];
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
resize(); addEventListener('resize', resize);
function burst(n){
  for(let i=0;i<n;i++){
    parts.push({ x:innerWidth/2 + (Math.random()-.5)*300, y:innerHeight*0.45,
      vx:(Math.random()-.5)*14, vy:-Math.random()*11-3, g:.28,
      r:3+Math.random()*4, c:`hsl(${200+Math.random()*140},90%,62%)`, life:0, ttl:70+Math.random()*50, rot:Math.random()*6.28, vr:(Math.random()-.5)*.3 });
  }
}
(function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.life < p.ttl);
  for(const p of parts){
    p.life++; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    const a = 1 - p.life/p.ttl;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
